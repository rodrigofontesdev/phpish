services:
  php-fpm:
    image: phpish:1.3.0
    build:
      context: ./docker
      args:
        PHP_VERSION: 8.3
        XDEBUG_VERSION: 3.3.2
        REDIS_VERSION: 6.1.0
    volumes:
      - ./web:/var/www/html
    ports:
      - 8080:8080
    networks:
      - mainnet
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    networks:
      - mainnet
    depends_on:
      - php-fpm
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  node:
    image: node:20.18.0-alpine
    working_dir: /var/www/html
    user: node
    volumes:
      - ./web:/var/www/html
    environment:
      - NODE_ENV=development
    command: [ 'sleep', 'infinity' ]
    networks:
      - mainnet
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB_FILE: /run/secrets/DB_DATABASE
      POSTGRES_USER_FILE: /run/secrets/DB_USERNAME
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - DB_DATABASE
      - DB_USERNAME
      - DB_PASSWORD
    networks:
      - mainnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7.4.1-alpine
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379
    networks:
      - mainnet
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

secrets:
  DB_DATABASE:
    file: ./web/.env
  DB_USERNAME:
    file: ./web/.env
  DB_PASSWORD:
    file: ./web/.env

networks:
  mainnet:


volumes:
  postgres-data:
  redis-data:
